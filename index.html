<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="logo">FinTrack</div>
        <div class="hamburger" onclick="Show()">
            <span class="menu-icon">☰</span>
            <span class="close-icon" style="display: none;">✕</span>
        </div>
        <ul class="nav-links">
            <li><a href="#hero">Home</a></li>
            <li><a href="#dashboard">Dashboard</a></li>
            <li><a href="#income">Income</a></li>
            <li><a href="#expense">Expense</a></li>
            <li><a href="#insights">Insights</a></li>
        </ul>
    </nav>
    <section id="hero">     
        <h1>Welcome to FinTrack!</h1>
    </section>
    <section id="dashboard">
        <div class="container">
            <h1 class="title">DASHBOARD</h1>
            <div class="dashboard">
                <!-- Total Card -->
                <div class="card">
                    <div class="card-header">
                        <span class="text">💰Total</span>
                    </div>
                    <h2 id="totalamount">₹0/-</h2>
                </div>
    
                <!-- Chart Section -->
                <div class="card chart-container">
                    <canvas id="dashboardChart"></canvas>
                </div>
    
                <!-- Income Card -->
                <div class="card">
                    <div class="card-header">
                        <span class="text">💸Income</span>
                    </div>
                    <h2 id="incamount">₹0/-</h2>
                </div>
    
                <!-- Expense Card -->
                <div class="card">
                    <div class="card-header">
                        <span class="text">💵Expense</span>
                    </div>
                    <h2 id="expamount">₹0/-</h2>
                </div>
            </div>
        </div>
   </section>  
   <section id="income">
    <div class="container">
        <h1 class="income-title">INCOME</h1>

        <div class="income-container">
            <div class="income-section-container">
                
                <!-- Details Section -->
                <div class="income-section">
                    <h2>DETAILS</h2>
                    <label  for="date">DATE:</label>
                    <input type="date" id="date">
                    
                    <label  for="amount">AMOUNT:</label>
                    <input type="number" id="amount" placeholder="Enter amount">
                    
                    <label for="details">DETAILS:</label>
                    <input type="text" id="details" placeholder="Enter details">

                    <button id="add-btn">ADD</button>
                </div>

                <!-- History Section -->
                <div class="income-section" id="income-sec">
                    <h2>HISTORY</h2>
                    <!-- <div id="incomehistory-item">
                        <div class="history-text">
                            <strong>Salary</strong>
                            <small>2 min ago</small>
                        </div>
                         <div class="history-amount">+ ₹500000</div> 
                    </div> -->
                </div>

                <!-- Chart Section -->
                <div class="income-section chart">
                    <h2>CHART</h2> 
                    <canvas id="incomeChart"></canvas>                 
                </div>


            </div>
        </div>
    </div>
   </section>
   <section id="expense">
    <div class="container">
        <h1 class="expense-title">EXPENSE</h1>
    
        <div class="expense-container">
            <div class="expense-section-container">
                
                <!-- Details Section -->
                <div class="expense-section">
                    <h2>DETAILS</h2>
                    <label for="expense-date">DATE:</label>
                    <input type="date" id="expense-date">
                    
                    <label for="expense-amount">AMOUNT:</label>
                    <input type="number" id="expense-amount" placeholder="Enter amount">
                    
                    <label for="expense-details">DETAILS:</label>
                    <input type="text" id="expense-details" placeholder="Enter details">
    
                    <button id="addibtn">ADD</button>
                </div>
    
                <!-- History Section -->
                <div class="expense-section" id="exp-sec">
                    <h2>HISTORY</h2>
                    <!-- <div id="expensehistory-item">
                        <div class="history-text" id="exphist-text">
                            <strong>Groceries</strong>
                            <small>5 min ago</small>
                        </div>
                        <div class="history-amount negative">- ₹2000</div>
                    </div> -->
                </div>
    
                <!-- Chart Section -->
                <div class="expense-section chart">
                    <h2>CHART</h2>
                    <canvas id="expenseChart"></canvas>
                </div>

    
            </div>
        </div>
    </div>    
   </section>
   <section id="insights">
    <div class="insights-container">
        <h1 class="insights-title">INSIGHTS</h1>
        <p id="ai-output"></p>
        <button class="analyze-btn">Analyze</button>       
    </div>
    </section>
    
    <section id="footer">
    <div class="footer">
        Made by <a href="https://github.com/somdutta2604">Somdutta</a> 
    </div>
   </section>
   <script src="script.js"></script>
</body>
</html>
